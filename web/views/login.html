<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — DLavie OS</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/" style="color:inherit;text-decoration:none">
        <div class="logo-text">⚡ DLavie<span style="color:var(--primary-l)"> OS</span></div>
        <div class="sub">WhatsApp Multi-Bot Control</div>
      </a>
    </div>
    <div class="auth-title">Selamat Datang Kembali</div>
    <div class="auth-sub">Login untuk mengakses dashboard bot kamu</div>

    <div id="login-error" class="form-error mb-16"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input name="email" type="email" class="form-input" placeholder="nama@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between">
          Password
          <a href="#" style="color:var(--text-3);font-size:0.8rem">Lupa password?</a>
        </label>
        <input name="password" type="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary btn-full btn-lg" style="margin-top:8px">
        Login
      </button>
    </form>

    <div class="auth-divider">atau</div>

    <div class="text-center" style="font-size:0.875rem;color:var(--text-2)">
      Belum punya akun?
      <a href="/register" style="color:var(--primary-l);font-weight:600;margin-left:4px">Daftar Gratis →</a>
    </div>

    <div style="margin-top:24px;padding:14px;background:rgba(99,102,241,0.06);border:1px solid rgba(99,102,241,0.15);border-radius:10px;font-size:0.82rem;color:var(--text-2)">
      💡 Setelah login, dapatkan kode bot di Dashboard untuk menghubungkan bot WhatsApp kamu ke DLavie OS.
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
