<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance — DLavie OS</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
.maint-page { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background: radial-gradient(ellipse 80% 60% at 50% 0%,rgba(99,102,241,0.12) 0%,transparent 70%); }
.maint-box { max-width:520px; }
.maint-icon { font-size:5rem; margin-bottom:24px; animation: spin 3s linear infinite; display:inline-block; }
@keyframes spin { 0%{ transform:rotate(0deg); } 100%{ transform:rotate(360deg); } }
.maint-title { font-size:2rem; font-weight:800; margin-bottom:12px; }
.maint-desc { color:var(--text-2); font-size:1rem; margin-bottom:32px; line-height:1.7; }
.maint-badge { display:inline-block; background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.3); color:#fcd34d; padding:8px 20px; border-radius:20px; font-size:0.85rem; font-weight:600; margin-bottom:20px; }
.maint-eta { background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:16px 24px; margin-top:24px; font-size:0.875rem; color:var(--text-2); }
.progress-bar { width:100%; height:4px; background:var(--surface-2); border-radius:2px; overflow:hidden; margin:16px 0 0; }
.progress-bar-inner { height:100%; background:linear-gradient(90deg,var(--primary),var(--secondary)); border-radius:2px; animation:progress 2s ease-in-out infinite; }
@keyframes progress { 0%{width:0;margin-left:0} 50%{width:60%;margin-left:20%} 100%{width:0;margin-left:100%} }
</style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-brand"><span>⚡</span><span>DLavie<span style="color:var(--primary-l)"> OS</span></span></a>
</nav>
<div class="maint-page">
  <div class="maint-box">
    <div class="maint-icon">🔧</div>
    <div class="maint-badge">🔴 Sedang Maintenance</div>
    <h1 class="maint-title" id="maint-title">Panel Sedang Maintenance</h1>
    <p class="maint-desc" id="maint-desc">Kami sedang melakukan peningkatan sistem untuk pengalaman yang lebih baik.<br>Harap bersabar dan coba lagi beberapa saat.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-secondary" onclick="location.reload()">🔄 Coba Lagi</button>
      <a href="/" class="btn btn-ghost">← Beranda</a>
    </div>
    <div class="maint-eta" id="maint-eta" style="display:none">
      <div>⏱️ Estimasi selesai: <strong id="maint-eta-time">—</strong></div>
    </div>
    <div class="progress-bar"><div class="progress-bar-inner"></div></div>
    <p style="margin-top:20px;font-size:0.78rem;color:var(--text-2)">Owner: Masuk dengan token di URL untuk bypass • <code style="font-size:0.72rem">?token=YOUR_JWT</code></p>
  </div>
</div>
<script>
async function loadMaintInfo() {
  try {
    const res  = await fetch('/api/maintenance');
    const data = await res.json();
    const m    = data.panel;
    if (m?.description) document.getElementById('maint-desc').textContent = m.description;
    if (m?.title)       document.getElementById('maint-title').textContent = m.title;
    if (m?.scheduledAt) {
      const eta = document.getElementById('maint-eta');
      const etaT = document.getElementById('maint-eta-time');
      if (eta && etaT) {
        eta.style.display = 'block';
        etaT.textContent = new Date(m.scheduledAt).toLocaleString('id-ID');
      }
    }
  } catch(_) {}
}
loadMaintInfo();
</script>
</body>
</html>
