<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — DLavie OS</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <div style="position:fixed;top:16px;right:16px;z-index:10">
    <button class="theme-toggle">☀️</button>
  </div>

  <div class="auth-card" style="max-width:420px">
    <div class="auth-logo">
      <a href="/" style="color:inherit;text-decoration:none">
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px">
          <div style="width:34px;height:34px;background:var(--grad-primary);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 0 16px rgba(99,102,241,0.3)">⚡</div>
          <div class="logo-text">DLavie<span class="gradient-text"> OS</span></div>
        </div>
        <div class="sub">WhatsApp Multi-Bot Control</div>
      </a>
    </div>
    <div class="auth-title">Buat Akun Gratis</div>
    <div class="auth-sub">Mulai dengan 5.000 token gratis. Tidak perlu kartu kredit.</div>

    <div id="register-error" class="form-error mb-12" style="min-height:16px"></div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label">Nama Lengkap</label>
        <input name="fullname" type="text" class="form-input" placeholder="Nama kamu" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input name="email" type="email" class="form-input" placeholder="nama@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-input" placeholder="Min. 8 karakter" required autocomplete="new-password">
        <div class="form-hint">Minimal 8 karakter</div>
      </div>
      <div class="form-group">
        <label class="form-label">Konfirmasi Password</label>
        <input name="confirm" type="password" class="form-input" placeholder="Ulangi password" required autocomplete="new-password">
      </div>
      <button type="submit" id="register-btn" class="btn btn-primary btn-full btn-lg" style="margin-top:6px">
        Daftar Sekarang — Gratis
      </button>
    </form>

    <div style="margin-top:14px;font-size:0.75rem;color:var(--text-3);text-align:center">
      Dengan mendaftar, kamu setuju dengan Syarat & Ketentuan DLavie OS
    </div>

    <div class="auth-divider">atau</div>

    <div class="text-center" style="font-size:0.845rem;color:var(--text-2)">
      Sudah punya akun?
      <a href="/login" style="color:var(--primary-l);font-weight:600;margin-left:4px">Login →</a>
    </div>

    <div style="margin-top:18px;padding:12px;background:var(--success-dim);border:1px solid rgba(34,197,94,0.15);border-radius:10px;font-size:0.8rem;color:var(--text-2)">
      🎁 Gratis 5.000 token saat daftar! Tidak perlu kartu kredit.
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
