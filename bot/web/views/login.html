<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — DLavie OS</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <!-- theme toggle top right -->
  <div style="position:fixed;top:16px;right:16px;z-index:10">
    <button class="theme-toggle">☀️</button>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <a href="/" style="color:inherit;text-decoration:none">
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px">
          <div style="width:34px;height:34px;background:var(--grad-primary);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 0 16px rgba(99,102,241,0.3)">⚡</div>
          <div class="logo-text">DLavie<span class="gradient-text"> OS</span></div>
        </div>
        <div class="sub">WhatsApp Multi-Bot Control</div>
      </a>
    </div>
    <div class="auth-title">Selamat Datang Kembali</div>
    <div class="auth-sub">Login untuk mengakses dashboard bot kamu</div>

    <div id="login-error" class="form-error mb-12" style="min-height:16px"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input name="email" type="email" class="form-input" placeholder="nama@email.com" required autocomplete="email" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between;align-items:center">
          Password
          <a href="#" style="color:var(--text-3);font-size:0.75rem;font-weight:400">Lupa password?</a>
        </label>
        <input name="password" type="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary btn-full btn-lg" style="margin-top:6px">
        Login
      </button>
    </form>

    <div class="auth-divider">atau</div>

    <div class="text-center" style="font-size:0.845rem;color:var(--text-2)">
      Belum punya akun?
      <a href="/register" style="color:var(--primary-l);font-weight:600;margin-left:4px">Daftar Gratis →</a>
    </div>

    <div style="margin-top:20px;padding:12px;background:var(--primary-dim);border:1px solid rgba(99,102,241,0.15);border-radius:10px;font-size:0.8rem;color:var(--text-2);line-height:1.5">
      💡 Setelah login, dapatkan kode bot di Dashboard untuk menghubungkan bot WhatsApp kamu ke DLavie OS.
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
